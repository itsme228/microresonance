; PlatformIO: ESP32-S3 (official espressif32 platform)
; Micro ESP32-S3 FH4R2: 4 MB Flash (Quad), 2 MB PSRAM (Quad).

[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = direct
lib_deps = plasmapper/PL ADXL355@^1.3.0, bblanchon/ArduinoJson@^7.0.0
; i2c_ll_stub.c is only needed on ESP32-C6 targets
build_src_filter = +<*> -<i2c_ll_stub.c>
board_build.sdkconfig_defaults = sdkconfig.defaults
; Micro ESP32-S3 FH4R2 (4MB Flash, 2MB PSRAM Quad)
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.extra_flags = -DBOARD_HAS_PSRAM
